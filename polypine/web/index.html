<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyPine</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #131722; --panel: #1e222d; --panel-2: #2a2e39; --border: #363a45;
    --text: #d1d4dc; --muted: #868993; --accent: #2962ff;
    --up: #26a69a; --down: #ef5350; --warn: #f0b429;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header .brand { font-weight: 700; letter-spacing: .3px; margin-right: 6px; }
  header .brand span { color: var(--accent); }
  label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
  /* Tooltips: hover or keyboard focus anywhere on the label (text or control). */
  [data-tip] { position: relative; }
  label[data-tip] > .lt { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
  [data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 0; z-index: 50;
    width: max-content; max-width: min(300px, calc(100vw - 24px)); white-space: normal; padding: 7px 9px; border-radius: 4px;
    background: #0b0e14; border: 1px solid var(--border); color: var(--text); font: 12px/1.45 -apple-system,
    BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: left; text-transform: none; letter-spacing: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,.45); pointer-events: none;
    /* display:none, not visibility:hidden: hidden tooltips must not widen the page (horizontal scroll). */
    display: none; }
  [data-tip]:hover::after, [data-tip]:focus-within::after { display: block; }
  [data-tip].tip-left::after { left: auto; right: 0; }
  select, input, button, textarea { font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
  input[type=number] { width: 72px; }
  input.wide { width: 170px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 5px 14px; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { color: var(--muted); margin-left: auto; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.err { color: var(--down); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100% - 49px); }
  #charts { display: grid; grid-template-rows: 3fr 1.4fr 1fr 1fr; min-height: 0; border-right: 1px solid var(--border); }
  .pane { position: relative; min-height: 0; border-bottom: 1px solid var(--border); }
  .pane .title { position: absolute; top: 4px; left: 8px; z-index: 3; font-size: 11px; color: var(--muted); pointer-events: none; }
  .pane .chart { position: absolute; inset: 0; }
  .legend { position: absolute; top: 20px; left: 8px; z-index: 3; font: 11px var(--mono); color: var(--text);
    background: rgba(19,23,34,.82); border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; pointer-events: none; }
  .legend .ptb { color: var(--warn); }
  aside { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .section { border-bottom: 1px solid var(--border); padding: 8px 10px; }
  .section h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .section h3 .spacer { flex: 1; }
  #editor { width: 100%; height: 260px; resize: vertical; font: 12px/1.45 var(--mono); tab-size: 4; white-space: pre; }
  #inputs { width: 100%; font: 12px var(--mono); }
  #stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 5px 7px; }
  .stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .stat .v { font: 600 14px var(--mono); }
  .pos { color: var(--up); } .neg { color: var(--down); }
  #tradesWrap { flex: 1; overflow: auto; min-height: 120px; }
  table { width: 100%; border-collapse: collapse; font: 11px var(--mono); }
  th, td { padding: 3px 4px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--panel-2); }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel-2); }
  .tag { font-size: 10px; padding: 0 4px; border-radius: 3px; }
  .tag.UP { background: rgba(38,166,154,.18); color: var(--up); } .tag.DOWN { background: rgba(239,83,80,.18); color: var(--down); }
  .note { color: var(--muted); font-size: 11px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; height: auto; } #charts { height: 900px; } }
</style>
</head>
<body>
<header>
  <div class="brand">Poly<span>Pine</span></div>
  <label data-tip="Coin to chart and backtest. Price bars come from Binance: spot for most coins, the USD-M perpetual for HYPE (its 1h/1d markets settle there)."><span class="lt">Asset</span> <select id="asset"></select></label>
  <label data-tip="Polymarket market to trade: the 5m, 15m, 1h or 1d Up/Down windows. Signals buy the Up or Down token of the window live at the fill."><span class="lt">Market</span> <select id="tf"></select></label>
  <label data-tip="Candle size the strategy runs on, independent of the market (e.g. 1m bars trading 5m markets). Smaller bars show more detail but backtest more slowly."><span class="lt">Bar</span> <select id="bar"></select></label>
  <label data-tip="Start of the chart and backtest range, in UTC."><span class="lt">From (UTC)</span> <input id="start" type="datetime-local" class="wide"></label>
  <label data-tip="End of the chart and backtest range, in UTC."><span class="lt">To (UTC)</span> <input id="end" type="datetime-local" class="wide"></label>
  <label data-tip="Pyne script from the strategies/ folder. Edit it on the right; Run backtest saves it first."><span class="lt">Strategy</span> <select id="strategy"></select></label>
  <label data-tip="USDC spent per entry. Beyond the size at the best ask, the rest fills one tick worse, up to the book depth within 5¢; anything more is left unfilled."><span class="lt">Stake $</span> <input id="stake" type="number" value="100" min="1"></label>
  <label data-tip="Delay from the Pine fill (the next bar&#x27;s open) to your order reaching the book. The recorded ask (entry) or bid (exit) at that moment is used."><span class="lt">Latency ms</span> <input id="latency" type="number" value="1000" min="0" step="100"></label>
  <label data-tip="Skip entries when fewer than this many seconds remain in the window. 0 = never skip."><span class="lt">Min secs left</span> <input id="minSecs" type="number" value="0" min="0"></label>
  <label data-tip="Off: a signal trades only the window live when it fires, and that bet settles at the window end even if Pine is still in position. On: while Pine stays in position, re-enter the same side at the start of every new window; the last bet is sold at the bid when Pine exits."><input id="roll" type="checkbox"> <span class="lt">Roll</span></label>
  <button id="load" data-tip="Load price and contract data for the range without running the strategy.">Load chart</button>
  <button id="run" class="primary" data-tip="Save the script and run the backtest (Ctrl/Cmd + Enter in the editor).">Run backtest</button>
  <div id="status"></div>
</header>
<main>
  <section id="charts">
    <div class="pane"><div class="title" id="priceTitle">Underlying</div><div class="legend" id="legend"></div><div class="chart" id="cPrice"></div></div>
    <div class="pane"><div class="title">Contract: Up token mid (live window) · green/red bands = resolved Up/Down</div><div class="chart" id="cContract"></div></div>
    <div class="pane"><div class="title">Indicators</div><div class="chart" id="cInd"></div></div>
    <div class="pane"><div class="title">Equity (USDC, after fees)</div><div class="chart" id="cEq"></div></div>
  </section>
  <aside>
    <div class="section">
      <h3>Script <span class="note" id="scriptName"></span><span class="spacer"></span>
        <button id="newScript">New</button><button id="save">Save</button></h3>
      <textarea id="editor" spellcheck="false"></textarea>
      <h3 style="margin-top:6px"><span data-tip='Overrides the script&#39;s input() defaults, keyed by input name or title, e.g. {"min_bps": 10} or {"Fast": 5}. Applies to this run only. Leave {} to use the defaults.'><span class="lt">Inputs override</span></span> (JSON, keys = input names or titles)</h3>
      <input id="inputs" value="{}">
    </div>
    <div class="section"><h3>Results</h3><div id="stats"><div class="note">Run a backtest to see results.</div></div></div>
    <div class="section" style="padding-bottom:0"><h3>Contract trades <span class="note" id="tradeCount"></span></h3></div>
    <div id="tradesWrap"><table><thead><tr>
      <th>Time (UTC)</th><th>Entry</th><th>Shares</th><th>Exit</th><th>Fees</th><th>PnL</th>
    </tr></thead><tbody id="trades"></tbody></table></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const C = { up: css('--up'), down: css('--down'), text: css('--text'), muted: css('--muted'), border: css('--border'),
            bg: css('--bg'), accent: css('--accent'), warn: css('--warn') };
const PLOT_COLORS = ['#2962ff', '#f0b429', '#ab47bc', '#26c6da', '#ff7043', '#9ccc65'];
const sec = (ms) => Math.floor(ms / 1000);
const fmtT = (ms) => new Date(ms).toISOString().slice(5, 19).replace('T', ' ');
const num = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? '–' : Number(v).toFixed(d);
const pct = (v) => (v === null || v === undefined) ? '–' : (v * 100).toFixed(2) + '%';

function status(msg, err = false) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; s.title = msg; }

function mkChart(el, opts = {}) {
  const ch = LightweightCharts.createChart(el, {
    autoSize: true, layout: { background: { color: C.bg }, textColor: C.muted, fontSize: 11 },
    grid: { vertLines: { color: '#1f2330' }, horzLines: { color: '#1f2330' } },
    rightPriceScale: { borderColor: C.border }, timeScale: { borderColor: C.border, timeVisible: true, secondsVisible: true },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }, ...opts });
  return ch;
}
const charts = { price: mkChart($('cPrice')), contract: mkChart($('cContract')),
  ind: mkChart($('cInd'), { leftPriceScale: { visible: true, borderColor: C.border } }), eq: mkChart($('cEq')) };
const candle = charts.price.addCandlestickSeries({ upColor: C.up, downColor: C.down, wickUpColor: C.up, wickDownColor: C.down, borderVisible: false });
// Price to beat: one step per market window (dashed amber).
const ptbLine = charts.price.addLineSeries({ color: C.warn, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
  lineType: LightweightCharts.LineType.WithSteps, priceLineVisible: false, lastValueVisible: true, title: 'to beat',
  crosshairMarkerVisible: false });
let windows = [];
const contractMid = charts.contract.addLineSeries({ color: C.accent, lineWidth: 1, priceFormat: { type: 'price', precision: 3, minMove: 0.001 },
  autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 1 } }) });
const outcomeBands = charts.contract.addHistogramSeries({ priceScaleId: 'bands', priceFormat: { type: 'price' }, base: 0,
  priceLineVisible: false, lastValueVisible: false, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 1 } }) });
charts.contract.priceScale('bands').applyOptions({ visible: false, scaleMargins: { top: 0, bottom: 0 } });
contractMid.createPriceLine({ price: 0.5, color: C.border, lineStyle: 2, lineWidth: 1, axisLabelVisible: false });
const equity = charts.eq.addBaselineSeries({ baseValue: { type: 'price', price: 0 }, topLineColor: C.up, bottomLineColor: C.down,
  topFillColor1: 'rgba(38,166,154,.25)', topFillColor2: 'rgba(38,166,154,.02)', bottomFillColor1: 'rgba(239,83,80,.02)', bottomFillColor2: 'rgba(239,83,80,.25)' });
let plotSeries = [];

// Keep all panes on the same visible time range.
let syncing = false;
Object.values(charts).forEach((src) => src.timeScale().subscribeVisibleTimeRangeChange((r) => {
  if (syncing || !r) return; syncing = true;
  Object.values(charts).forEach((dst) => { if (dst !== src) try { dst.timeScale().setVisibleRange(r); } catch (e) {} });
  syncing = false;
}));

function toLocalInput(ms) { return new Date(ms).toISOString().slice(0, 16); }
function params() {
  return { asset: $('asset').value, tf: $('tf').value, bar: $('bar').value, start: $('start').value, end: $('end').value };
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

let meta = null;
async function init() {
  meta = await api('/api/meta');
  const fill = (sel, items, val) => { $(sel).innerHTML = items.map((x) => `<option>${x}</option>`).join(''); if (val) $(sel).value = val; };
  fill('asset', meta.assets, 'BTC'); fill('tf', meta.timeframes, '5m'); fill('bar', meta.bars, '1m');
  const names = await api('/api/strategies');
  fill('strategy', names, names.includes('late_momentum.py') ? 'late_momentum.py' : names[0]);
  setDefaultRange();
  $('asset').onchange = $('tf').onchange = setDefaultRange;
  $('strategy').onchange = loadScript;
  await loadScript();
  await loadChart();
}

function setDefaultRange() {
  // Default: the last 24h of recorded data (ending now at the latest), whether or not markets have resolved.
  const cov = meta.coverage.find((c) => c.asset === $('asset').value && c.tf === $('tf').value);
  const end = Math.min(Date.now(), cov ? cov.last_ms : Date.now());
  const start = Math.max(cov ? cov.first_ms : 0, end - 86400000);
  $('start').value = toLocalInput(start); $('end').value = toLocalInput(end);
  if (!cov) { status(`No ${$('asset').value} ${$('tf').value} markets recorded yet`, true); return; }
  status(`${cov.markets.toLocaleString()} ${cov.asset} ${cov.tf} markets (${cov.resolved.toLocaleString()} resolved), ${fmtT(cov.first_ms)} → ${fmtT(cov.last_ms)}` +
    (cov.resolved ? '' : ' · backtest trades stay "open" until markets resolve'));
}

async function loadScript() {
  const s = await api(`/api/strategies/${$('strategy').value}`);
  $('editor').value = s.source; $('scriptName').textContent = s.name;
}

async function saveScript() {
  await api(`/api/strategies/${$('strategy').value}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: $('editor').value }) });
  status(`Saved ${$('strategy').value}`);
}

async function newScript() {
  const name = prompt('New script name (e.g. my_strategy.py)'); // eslint-disable-line no-alert
  if (!name) return;
  await api(`/api/strategies/${name}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: $('editor').value }) });
  const names = await api('/api/strategies');
  $('strategy').innerHTML = names.map((x) => `<option>${x}</option>`).join(''); $('strategy').value = name; $('scriptName').textContent = name;
}

async function loadChart() {
  const p = params(); status('Loading…');
  const q = new URLSearchParams(p);
  const [bars, con] = await Promise.all([api(`/api/bars?${q}`), api(`/api/contract?${q}`)]);
  setCandles(bars);
  setContract(con);
  $('priceTitle').textContent = `${p.asset}/USDT · Binance · ${p.bar}`;
  charts.price.timeScale().fitContent();
  status(`${bars.length.toLocaleString()} bars · ${con.windows.length} ${p.tf} windows`);
}

function setCandles(bars) { candle.setData(bars.map((b) => ({ time: sec(b.t), open: b.o, high: b.h, low: b.l, close: b.c }))); }

function setPriceToBeat(ws) {
  windows = ws.filter((w) => w.price_to_beat !== null && w.price_to_beat !== undefined).sort((a, b) => a.start_ms - b.start_ms);
  const pts = [];
  windows.forEach((w, i) => {
    pts.push({ time: sec(w.start_ms), value: w.price_to_beat });
    const next = windows[i + 1];
    if (!next || next.start_ms > w.end_ms) pts.push({ time: sec(w.end_ms) }); // gap: end the step
  });
  const uniq = pts.filter((p, i) => i === 0 || p.time > pts[i - 1].time);
  ptbLine.setData(uniq);
  showLegend(null);
}

function windowAt(tSec) {
  let lo = 0, hi = windows.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1, w = windows[m];
    if (tSec * 1000 < w.start_ms) hi = m - 1; else if (tSec * 1000 >= w.end_ms) lo = m + 1; else return w;
  }
  return null;
}

function showLegend(param) {
  const el = $('legend');
  let t = param && param.time, close = null;
  if (param && param.seriesData) { const d = param.seriesData.get(candle); close = d ? (d.close ?? d.value) : null; }
  const w = t ? windowAt(t) : windows[windows.length - 1];
  if (!w) { el.textContent = windows.length ? '' : 'No price to beat for this range'; return; }
  const hm = (ms) => new Date(ms).toISOString().slice(11, 16);
  const px = (v) => Number(v).toLocaleString(undefined, { maximumFractionDigits: v < 10 ? 5 : 2 });
  let html = `${$('tf').value} window ${hm(w.start_ms)}–${hm(w.end_ms)} UTC · <span class="ptb">price to beat ${px(w.price_to_beat)}${w.price_to_beat_source === 'chainlink'
    ? ' <span title="Chainlink 60s TWAP before the window start, from our recording; Polymarket publishes the official value after resolution">(est.)</span>' : ''}</span>`;
  if (close !== null) {
    const bps = (close / w.price_to_beat - 1) * 1e4;
    html += ` · Binance close ${px(close)} <span class="${bps >= 0 ? 'pos' : 'neg'}">(${bps >= 0 ? '+' : ''}${bps.toFixed(1)} bps, ${bps >= 0 ? 'Up' : 'Down'} winning)</span>`;
  }
  if (w.final_price !== null && w.final_price !== undefined) html += ` · final ${px(w.final_price)}`;
  if (w.outcome) html += ` · <span class="${w.outcome === 'UP' ? 'pos' : 'neg'}">${w.outcome}</span>`;
  el.innerHTML = html;
}
charts.price.subscribeCrosshairMove((param) => showLegend(param && param.time ? param : null));

function setContract(con) {
  setPriceToBeat(con.windows);
  contractMid.setData(con.bars.map((b) => ({ time: sec(b.t), value: b.c })));
  // Outcome band: one bar per window, coloured by resolution (drawn on a hidden 0..1 scale).
  // Shade every bar of a window with its outcome.
  const ws = con.windows.filter((w) => w.outcome); let j = 0; const bands = [];
  con.bars.forEach((b) => {
    while (j < ws.length && ws[j].end_ms <= b.t) j++;
    const w = ws[j];
    if (w && w.start_ms <= b.t) bands.push({ time: sec(b.t), value: 1, color: w.outcome === 'UP' ? 'rgba(38,166,154,.13)' : 'rgba(239,83,80,.13)' });
  });
  outcomeBands.setData(bands);
}

async function runBacktest() {
  let inputs;
  try { inputs = JSON.parse($('inputs').value || '{}'); } catch (e) { status('Inputs must be valid JSON', true); return; }
  $('run').disabled = true; status('Saving script & running backtest…');
  try {
    await saveScript();
    const body = { ...params(), script: $('strategy').value, inputs, stake: +$('stake').value,
      latency_ms: +$('latency').value, min_secs_left: +$('minSecs').value, roll: $('roll').checked };
    const t0 = performance.now();
    const res = await api('/api/backtest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    render(res);
    const con = await api(`/api/contract?${new URLSearchParams(params())}`);
    setContract(con);
    status(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s · ${res.signals} Pine signals → ${res.trades.length} contract trades` +
      (res.bar_factor > 1 ? ` · chart shows ${res.bar_factor}× aggregated bars` : ''));
  } catch (e) { status(e.message, true); } finally { $('run').disabled = false; }
}

function render(res) {
  setCandles(res.bars);
  // Plots: overlay those on the price's scale, others to the indicator pane.
  plotSeries.forEach(({ chart, s }) => chart.removeSeries(s)); plotSeries = [];
  const closes = res.bars.map((b) => b.c).sort((a, b) => a - b); const mid = closes[closes.length >> 1] || 1;
  const keys = [...new Set(res.plots.flatMap((p) => Object.keys(p)))].filter((k) => k !== 't');
  keys.forEach((k, i) => {
    const pts = res.plots.filter((p) => p[k] !== null && p[k] !== undefined).map((p) => ({ time: sec(p.t), value: p[k] }));
    if (!pts.length) return;
    const vals = pts.map((p) => p.value).sort((a, b) => a - b); const m = vals[vals.length >> 1];
    const overlay = Math.abs(m / mid - 1) < 0.2;
    const chart = overlay ? charts.price : charts.ind;
    // Indicators of different magnitude get their own axis (alternating right/left).
    const scale = overlay ? 'right' : (plotSeries.filter((p) => p.chart === charts.ind).length % 2 ? 'left' : 'right');
    const s = chart.addLineSeries({ color: PLOT_COLORS[i % PLOT_COLORS.length], lineWidth: 1, title: k, priceScaleId: scale,
      priceLineVisible: false, lastValueVisible: true });
    s.setData(pts); plotSeries.push({ chart, s });
  });

  // Markers: entries on price + contract charts, exits on price chart.
  const tr = res.trades;
  const markers = [];
  tr.forEach((t) => {
    const up = t.token === 'UP';
    markers.push({ time: sec(t.entry_ms), position: up ? 'belowBar' : 'aboveBar', color: up ? C.up : C.down,
      shape: up ? 'arrowUp' : 'arrowDown', text: `${t.token} ${t.entry_price.toFixed(2)}` });
    if (t.exit_kind !== 'open') markers.push({ time: sec(t.exit_ms), position: 'inBar', color: t.pnl >= 0 ? C.up : C.down, shape: 'circle', text: '' });
  });
  markers.sort((a, b) => a.time - b.time);
  const barTimes = new Set(res.bars.map((b) => sec(b.t)));
  const snap = (m) => { if (barTimes.has(m.time)) return m; const step = res.bars.length > 1 ? sec(res.bars[1].t) - sec(res.bars[0].t) : 60;
    return { ...m, time: m.time - ((m.time - sec(res.bars[0].t)) % step) }; };
  candle.setMarkers(markers.map(snap).sort((a, b) => a.time - b.time));
  contractMid.setMarkers(tr.map((t) => ({ time: sec(t.entry_ms) - (sec(t.entry_ms) % 60), position: t.token === 'UP' ? 'belowBar' : 'aboveBar',
    color: t.token === 'UP' ? C.up : C.down, shape: 'circle', text: '' })).sort((a, b) => a.time - b.time));

  // Equity curve.
  let eq = 0; const pts = [];
  [...tr].filter((t) => t.exit_kind !== 'open').sort((a, b) => a.exit_ms - b.exit_ms).forEach((t) => {
    eq += t.pnl; const time = sec(t.exit_ms);
    if (pts.length && pts[pts.length - 1].time === time) pts[pts.length - 1].value = eq; else pts.push({ time, value: eq });
  });
  equity.setData(pts);

  renderStats(res.stats); renderTrades(tr, res.skipped);
  charts.price.timeScale().fitContent();
}

function renderStats(s) {
  const cls = (v) => (v === null || v === undefined) ? '' : (v >= 0 ? 'pos' : 'neg');
  const items = [
    ['Net PnL', '$' + num(s.net_pnl), cls(s.net_pnl)], ['ROI', pct(s.roi), cls(s.roi)], ['Trades', s.trades, ''],
    ['Win rate', pct(s.win_rate), ''], ['Avg entry px', num(s.avg_entry_price, 3), ''], ['Edge vs implied', num(s.edge_vs_implied, 4), cls(s.edge_vs_implied)],
    ['Fees', '$' + num(s.fees), 'neg'], ['Max DD', '$' + num(s.max_drawdown), ''], ['t-stat', num(s.pnl_per_trade_t), cls(s.pnl_per_trade_t)],
    ['Settled / sold', `${s.settled} / ${s.sold}`, ''], ['Staked', '$' + num(s.staked, 0), ''], ['Skipped', s.skipped, ''],
    ['Largest win', '$' + num(s.largest_win), ''], ['Net excl. best trade', '$' + num(s.net_pnl_ex_best), cls(s.net_pnl_ex_best)],
    ['Win share of best', s.net_pnl > 0 && s.largest_win ? pct(s.largest_win / s.net_pnl) : '–', ''],
  ];
  $('stats').innerHTML = items.map(([k, v, c]) => `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');
}

function renderTrades(tr, skipped) {
  $('tradeCount').textContent = `${tr.length} trades · ${skipped.length} skipped`;
  const rows = [...tr].reverse().slice(0, 2000).map((t, i) => `<tr data-t="${t.entry_ms}">
    <td>${fmtT(t.entry_ms)}</td><td><span class="tag ${t.token}">${t.token}</span> ${num(t.entry_price, 3)}</td>
    <td>${num(t.shares, 1)}</td><td>${t.exit_kind}${t.exit_kind === 'open' ? '' : ' ' + num(t.exit_price, 2)}</td><td>${num(t.fees)}</td>
    <td class="${t.pnl >= 0 ? 'pos' : 'neg'}">${num(t.pnl)}</td></tr>`);
  $('trades').innerHTML = rows.join('');
}

// Open each tooltip toward the side with more room (the toolbar wraps on narrow screens).
document.querySelectorAll('[data-tip]').forEach((el) => {
  const place = () => el.classList.toggle('tip-left', el.getBoundingClientRect().left + 310 > window.innerWidth);
  el.addEventListener('mouseenter', place); el.addEventListener('focusin', place);
});
$('trades').onclick = (e) => {
  const row = e.target.closest('tr'); if (!row) return;
  const t = sec(+row.dataset.t);
  charts.price.timeScale().setVisibleRange({ from: t - 1800, to: t + 900 });
};
$('editor').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); const el = e.target; const s = el.selectionStart;
    el.value = el.value.slice(0, s) + '    ' + el.value.slice(el.selectionEnd); el.selectionStart = el.selectionEnd = s + 4; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runBacktest();
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveScript().catch((er) => status(er.message, true)); }
});
$('load').onclick = () => loadChart().catch((e) => status(e.message, true));
$('run').onclick = runBacktest;
$('save').onclick = () => saveScript().catch((e) => status(e.message, true));
$('newScript').onclick = () => newScript().catch((e) => status(e.message, true));
init().catch((e) => status(e.message, true));
</script>
</body>
</html>
